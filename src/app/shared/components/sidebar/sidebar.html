<aside class="sidebar">
  <!-- Brand / Logo Area -->
  <div class="sidebar-brand">
    <div class="logo-icon">
      <img src="assets/logo.png" alt="ClinicFlow logo" />
    </div>
    <div class="brand-text">
      <h1>ClinicFlow</h1>
      <span>ADMIN WORKSPACE</span>
    </div>
  </div>

  <!-- Navigation Links -->
  <nav class="sidebar-nav">
    <button type="button" class="nav-link menu-toggle" aria-controls="sidebar-menu"
            [attr.aria-expanded]="menuOpen" (click)="toggleMenu()">
      <svg [lucideIcon]="mainIcon" size="18"></svg>
      Main
      <svg class="chevron" [lucideIcon]="menuOpen ? openIcon : closedIcon" size="18"></svg>
    </button>

    <ul id="sidebar-menu" *ngIf="menuOpen">
      <li *ngFor="let item of menuItems">
        <a [routerLink]="item.route" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link">
          <!-- FIXED: Use svg with lucideIcon binding -->
          <svg [lucideIcon]="item.icon" size="18"></svg>
          {{ item.label }}
        </a>
      </li>
    </ul>

    <button type="button" class="nav-link logout-link" (click)="confirmLogout()">
      <svg [lucideIcon]="logoutIcon" size="18"></svg>
      Log out
    </button>
  </nav>

  <!-- Version Area -->
  <div class="sidebar-footer">
    <div class="version-info">
      ClinicFlow &middot; Admin v1.0
    </div>
  </div>

  <div class="logout-modal-backdrop" *ngIf="showLogoutConfirm" (click)="cancelLogout()">
    <div class="logout-modal" role="dialog" aria-modal="true" aria-labelledby="logout-title" (click)="$event.stopPropagation()">
      <h3 id="logout-title">Confirm logout</h3>
      <p>Are you sure you want to log out?</p>

      <div class="logout-modal-actions">
        <button type="button" class="cancel-btn" (click)="cancelLogout()">No</button>
        <button type="button" class="confirm-btn" (click)="logout()">Yes</button>
      </div>
    </div>
  </div>
</aside>
