<header class="auth-header">

  <div class="brand">
    <span class="brand-logo">
      <img src="assets/logo2.png" alt="ClinicFlow System" />
    </span>
  </div>

  @if (clinic.clinicInfo().phone; as phone) {
    <div class="header-help">
      <span>Need help?</span>
      <a [href]="'tel:' + phone">Call {{ phone }}</a>
    </div>
  }

</header>
