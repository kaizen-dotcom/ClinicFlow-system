<header class="navbar">
  <div class="nav-left">
    <span class="clinic-name">{{ clinic.admin().clinicName }}</span>
  </div>

  <div class="nav-right">
    <span class="nav-date">{{ today | date: 'EEEE, d MMM y' }}</span>

    <a routerLink="/admin/appointments" [queryParams]="{ status: 'Pending' }" class="bell"
       [attr.aria-label]="pendingCount() + ' pending requests'" title="Pending requests">
      <svg [lucideIcon]="BellIcon" size="18"></svg>
      @if (pendingCount()) { <span class="bell-count">{{ pendingCount() }}</span> }
    </a>

    <div class="nav-divider"></div>

    <a routerLink="/admin/settings" class="profile-menu" title="Profile & settings">
      <div class="profile-info">
        <span class="profile-name">{{ clinic.admin().fullName }}</span>
        <span class="profile-role">Administrator</span>
      </div>
      <svg [lucideIcon]="ChevronDownIcon" size="16" class="chevron"></svg>
    </a>
  </div>
</header>
